[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MIDI-QWERTY"
version = "0.1.0"
description = "Mapeia teclas do teclado QWERTY para comandos MIDI (CC, Note, PC) enviados a uma porta MIDI virtual (loopMIDI), com interface gráfica."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "vfcoelho" }]
dependencies = [
    "customtkinter>=5.2.2",
    "keyboard>=0.13.5",
    "mido>=1.3.2",
    "python-rtmidi>=1.5.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
midi-qwerty = "midi_cc.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
